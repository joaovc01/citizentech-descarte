name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Sem arquivo .env no repositorio
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then exit 1; fi

      - name: Lint
        run: ruff check .

      - name: Testes com cobertura minima de 70 por cento
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=70